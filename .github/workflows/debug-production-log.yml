name: Debug production log

on:
  push:
    branches:
      - helosfinance

jobs:
  inspect-production-log:
    name: Inspect production Laravel log
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/helios_lightsail
          printf '%s\n' "${{ secrets.HELIOS_LIGHTSAIL_SSH_KEY }}" > ~/.ssh/helios_lightsail
          ssh-keyscan -H 65.1.151.96 >> ~/.ssh/known_hosts

      - name: Compact owner profit summary
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 'sudo bash -s' <<'REMOTE'
          cd /var/www/helosfinance
          php artisan tinker --execute='$business = App\Domains\Shared\Models\Business::find(5); $summary = app(App\Domains\FinancialClarity\Services\BusinessHealthSnapshotService::class)->previewRange($business, Illuminate\Support\Carbon::parse("2026-07-01"), Illuminate\Support\Carbon::parse("2026-07-29")->endOfDay()); $metrics = $summary["metrics"] ?? []; $cohorts = data_get($metrics, "delivered_dispatch_cohorts", []); $ownerRevenue = (float) data_get($cohorts, "dispatched_this_period.value", 0); $ownerDeliveredCount = (int) data_get($cohorts, "dispatched_this_period.count", 0); $verifiedDeliveryCourier = (float) data_get($cohorts, "dispatched_this_period.courier_cost", 0); $returnCourier = (float) data_get($metrics, "return_courier_costs", 0); $ownerCourier = $verifiedDeliveryCourier + $returnCourier; $production = (float) data_get($metrics, "production_costs", 0) + (float) data_get($metrics, "missing_estimated_production_costs", 0); $companyCosts = (float) data_get($metrics, "manual_overhead_costs", 0) + (float) data_get($metrics, "salary_pressure", 0) + (float) data_get($metrics, "bank_payment_charge_bank_rows", 0); $other = (float) ($summary["leakage_total"] ?? 0) - (float) data_get($metrics, "recovered_value", 0); $profit = $ownerRevenue - $ownerCourier - $production - $companyCosts - $other; echo json_encode(["period" => "2026-07-01 to 2026-07-29", "business" => $business?->name, "verified_delivered_sales" => round($ownerRevenue, 2), "verified_delivered_parcels" => $ownerDeliveredCount, "delivery_courier_for_verified_sales" => round($verifiedDeliveryCourier, 2), "return_courier" => round($returnCourier, 2), "total_owner_courier" => round($ownerCourier, 2), "production_cost_used" => round($production, 2), "recorded_production_cost" => round((float) data_get($metrics, "production_costs", 0), 2), "estimated_missing_production_cost" => round((float) data_get($metrics, "missing_estimated_production_costs", 0), 2), "company_costs_entered" => round($companyCosts, 2), "expenses_entered" => round((float) data_get($metrics, "manual_overhead_costs", 0), 2), "salary_pressure" => round((float) data_get($metrics, "salary_pressure", 0), 2), "bank_review_only_charges" => round((float) data_get($metrics, "bank_payment_charge_bank_rows", 0), 2), "other_losses_minus_recoveries" => round($other, 2), "estimated_owner_profit" => round($profit, 2), "delivered_status_total_not_owner_revenue" => round((float) ($summary["revenue_total"] ?? 0), 2), "delivered_status_parcels_not_owner_rule" => (int) data_get($metrics, "order_counts.delivered", 0), "delivered_rows_excluded_from_owner_profit_value" => round(max((float) ($summary["revenue_total"] ?? 0) - $ownerRevenue, 0), 2), "delivered_rows_excluded_from_owner_profit_count" => max((int) data_get($metrics, "order_counts.delivered", 0) - $ownerDeliveredCount, 0), "dispatched_value" => round((float) data_get($metrics, "dispatched_parcel_value", 0), 2), "dispatched_parcels" => (int) data_get($metrics, "dispatched_parcel_count", 0), "pending_delivery_value" => round((float) data_get($metrics, "pending_dispatch_value", 0), 2), "pending_delivery_parcels" => (int) data_get($metrics, "pending_dispatch_count", 0)], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL;'
          REMOTE

      - name: Inspect hosted Arafath parcel pipeline
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 'sudo bash -s' <<'REMOTE'
          cd /var/www/helosfinance
          php artisan tinker --execute='$user = App\Models\User::query()->whereRaw("LOWER(email) = ?", ["arafath@helos.com"])->first(); $business = $user?->business ?: App\Domains\Shared\Models\Business::query()->where("name", "like", "%Horns England%")->orderByDesc("id")->first(); $integration = App\Domains\Shared\Models\IntegrationSource::query()->where("business_id", $business?->id)->where("type", "stock_app")->latest("updated_at")->first(); $start = Illuminate\Support\Carbon::parse("2026-07-01")->startOfDay(); $end = Illuminate\Support\Carbon::parse("2026-08-01")->endOfDay(); $page = new App\Filament\Pages\TodaysWork; $page->business = $business; $page->parcelStartDate = $start->toDateString(); $page->parcelEndDate = $end->toDateString(); $method = new ReflectionMethod(App\Filament\Pages\TodaysWork::class, "employeeParcelMovement"); $method->setAccessible(true); $movement = $method->invoke($page); $events = App\Domains\Shared\Models\OperationalEvent::query()->where("business_id", $business?->id)->whereIn("source", ["stock_app", "stock_app_sync"])->whereBetween("occurred_at", [$start, $end]); echo json_encode(["business" => $business?->only(["id", "name"]), "integration" => $integration ? ["id" => $integration->id, "base_url" => $integration->base_url, "status" => $integration->status, "last_synced_at" => optional($integration->last_synced_at)->toDateTimeString(), "last_webhook_received_at" => optional($integration->last_webhook_received_at)->toDateTimeString(), "last_successful_sync_at" => optional($integration->last_successful_sync_at)->toDateTimeString(), "read_config" => $integration->stockAppPendingReadConfig()] : null, "live_pending_compare" => app(App\Domains\Shared\Services\StockAppPendingParityService::class)->compare($business, $start, $end, (int) ($movement["pending_confirmation_count"] ?? 0)), "dashboard_boxes" => ["dispatched_count" => $movement["dispatched_count"] ?? null, "dispatched_value" => $movement["dispatched_value"] ?? null, "pending_confirmation_count" => $movement["pending_confirmation_count"] ?? null, "pending_confirmation_value" => $movement["pending_confirmation_value"] ?? null, "confirmed_waiting_dispatch_count" => $movement["confirmed_waiting_dispatch_count"] ?? null, "confirmed_waiting_dispatch_value" => $movement["confirmed_waiting_dispatch_value"] ?? null, "dispatched_waiting_delivery_count" => $movement["dispatched_waiting_delivery_count"] ?? null, "dispatched_waiting_delivery_value" => $movement["dispatched_waiting_delivery_value"] ?? null, "delivered_so_far_count" => $movement["delivered_so_far_count"] ?? null, "delivered_so_far_value" => $movement["delivered_so_far_value"] ?? null], "event_type_totals" => (clone $events)->selectRaw("event_type, COUNT(*) rows, COUNT(DISTINCT external_id) distinct_external_ids, SUM(revenue_amount) revenue")->groupBy("event_type")->orderBy("event_type")->get()->toArray(), "recent_pending_like" => App\Domains\Shared\Models\OperationalEvent::query()->where("business_id", $business?->id)->whereIn("source", ["stock_app", "stock_app_sync"])->where(function ($q) { $q->where("event_type", "order_created")->orWhere("payload->confirmation_status", "pending")->orWhere("payload->status", "pending")->orWhere("payload->confirm_status", "pending"); })->latest("occurred_at")->limit(20)->get(["id", "event_type", "external_id", "revenue_amount", "occurred_at", "payload"])->toArray()], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL;'
          REMOTE

      - name: Publish sanitized parcel diagnostic
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 'sudo bash -s' <<'REMOTE'
          cd /var/www/helosfinance
          mkdir -p public/diagnostics
          php artisan tinker --execute='$user = App\Models\User::query()->whereRaw("LOWER(email) = ?", ["arafath@helos.com"])->first(); $business = $user?->business ?: App\Domains\Shared\Models\Business::query()->where("name", "like", "%Horns England%")->orderByDesc("id")->first(); $integration = App\Domains\Shared\Models\IntegrationSource::query()->where("business_id", $business?->id)->where("type", "stock_app")->latest("updated_at")->first(); $start = Illuminate\Support\Carbon::parse("2026-07-01")->startOfDay(); $end = Illuminate\Support\Carbon::parse("2026-08-01")->endOfDay(); $page = new App\Filament\Pages\TodaysWork; $page->business = $business; $page->parcelStartDate = $start->toDateString(); $page->parcelEndDate = $end->toDateString(); $method = new ReflectionMethod(App\Filament\Pages\TodaysWork::class, "employeeParcelMovement"); $method->setAccessible(true); $movement = $method->invoke($page); $events = App\Domains\Shared\Models\OperationalEvent::query()->where("business_id", $business?->id)->whereIn("source", ["stock_app", "stock_app_sync"])->whereBetween("occurred_at", [$start, $end]); $config = $integration?->stockAppPendingReadConfig() ?? []; $data = ["generated_at" => now()->toDateTimeString(), "business" => $business?->only(["id", "name"]), "integration" => $integration ? ["id" => $integration->id, "base_url" => $integration->base_url, "status" => $integration->status, "last_synced_at" => optional($integration->last_synced_at)->toDateTimeString(), "last_webhook_received_at" => optional($integration->last_webhook_received_at)->toDateTimeString(), "last_successful_sync_at" => optional($integration->last_successful_sync_at)->toDateTimeString(), "read_config" => ["has_email" => filled($config["email"] ?? null), "has_password" => filled($config["password"] ?? null), "client_id" => $config["client_id"] ?? null]] : null, "live_pending_compare" => app(App\Domains\Shared\Services\StockAppPendingParityService::class)->compare($business, $start, $end, (int) ($movement["pending_confirmation_count"] ?? 0)), "dashboard_boxes" => ["dispatched_count" => $movement["dispatched_count"] ?? null, "dispatched_value" => $movement["dispatched_value"] ?? null, "pending_confirmation_count" => $movement["pending_confirmation_count"] ?? null, "pending_confirmation_value" => $movement["pending_confirmation_value"] ?? null, "confirmed_waiting_dispatch_count" => $movement["confirmed_waiting_dispatch_count"] ?? null, "confirmed_waiting_dispatch_value" => $movement["confirmed_waiting_dispatch_value"] ?? null, "dispatched_waiting_delivery_count" => $movement["dispatched_waiting_delivery_count"] ?? null, "dispatched_waiting_delivery_value" => $movement["dispatched_waiting_delivery_value"] ?? null, "delivered_so_far_count" => $movement["delivered_so_far_count"] ?? null, "delivered_so_far_value" => $movement["delivered_so_far_value"] ?? null], "event_type_totals" => (clone $events)->selectRaw("event_type, COUNT(*) rows, COUNT(DISTINCT external_id) distinct_external_ids, SUM(revenue_amount) revenue")->groupBy("event_type")->orderBy("event_type")->get()->toArray()]; file_put_contents(public_path("diagnostics/parcel-pipeline.json"), json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          REMOTE

      - name: Tail Laravel logs
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 "
            sudo bash -lc '
              for file in \$(find /var/www -path \"*/storage/logs/laravel.log\" 2>/dev/null | sort -u); do
                echo \"===== \$file =====\"
                tail -n 160 \"\$file\" || true
              done
            '
          "

      - name: Inspect Nifras authorization path
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 'sudo bash -s' <<'REMOTE'
          echo "===== nginx site root ====="
          grep -R -E "server_name|root " /etc/nginx/sites-enabled 2>/dev/null || true

          echo "===== recent HTTP 403 responses ====="
          for file in /var/log/nginx/*access*.log; do
            [ -f "$file" ] || continue
            awk '$9 == 403 { print }' "$file" | tail -n 30
          done

          echo "===== Nifras application authorization ====="
          cd /var/www/helosfinance
          php artisan tinker --execute='$u = App\Models\User::whereRaw("LOWER(email) = ?", ["nifras@helos.com"])->first(); dump($u?->only(["id", "email", "business_id", "client_group_id", "is_platform_admin", "is_employee", "employee_access_profile", "responsibilities_configured", "is_staff_supervisor", "supervisor_user_id"])); if ($u) { Illuminate\Support\Facades\Auth::login($u); dump(["panel" => $u->canAccessPanel(Filament\Facades\Filament::getPanel("admin")), "staff" => $u->isStaff(), "todays_work" => App\Filament\Pages\TodaysWork::canAccess(), "url" => App\Filament\Pages\TodaysWork::getUrl()]); }'

          echo "===== Hosted role and recent task state ====="
          php artisan tinker --execute='$s = App\Models\User::whereRaw("LOWER(email) = ?", ["sanduashani@gmail.com"])->first(); dump(["sanduashani" => $s?->only(["id", "name", "business_id", "employee_access_profile", "staff_responsibilities", "is_staff_supervisor", "supervisor_user_id"])]); dump(App\Domains\Shared\Models\Mission::with(["assignedUser:id,name,email"])->where("business_id", 5)->where(function ($q) { $q->where("title", "like", "%production%")->orWhere("summary", "like", "%production%")->orWhere("responsibility_code", "production"); })->latest("updated_at")->limit(20)->get(["id", "title", "summary", "responsibility_code", "source_type", "source_id", "assigned_user_id", "assigned_by", "status", "due_at", "metadata"])->toArray());'

          echo "===== Current-month financial source reconciliation ====="
          php artisan tinker --execute='$b = App\Domains\Shared\Models\Business::find(5); $start = now()->startOfMonth(); $end = now()->endOfMonth(); $events = App\Domains\Shared\Models\OperationalEvent::where("business_id", 5)->whereBetween("occurred_at", [$start, $end]); dump(["snapshot" => app(App\Domains\FinancialClarity\Services\BusinessHealthSnapshotService::class)->currentMonthSummary($b), "pipeline" => app(App\Domains\FinancialClarity\Services\RevenuePipelineService::class)->forCurrentMonth($b), "event_totals" => (clone $events)->selectRaw("event_type, COUNT(*) row_count, COUNT(DISTINCT external_id) distinct_orders, SUM(revenue_amount) revenue, SUM(direct_cost_amount) direct_cost, SUM(leakage_amount) leakage, SUM(recovery_amount) recovery")->groupBy("event_type")->orderBy("event_type")->get()->toArray(), "duplicate_delivered_ids" => (clone $events)->where("event_type", "order_delivered")->selectRaw("external_id, COUNT(*) copies, SUM(revenue_amount) revenue")->groupBy("external_id")->havingRaw("COUNT(*) > 1")->orderByDesc("copies")->limit(30)->get()->toArray(), "largest_delivered_rows" => (clone $events)->where("event_type", "order_delivered")->orderByDesc("revenue_amount")->limit(20)->get(["id", "external_id", "revenue_amount", "direct_cost_amount", "channel", "occurred_at", "payload"])->toArray()]);'

          echo "===== Stable Stock App order reconciliation ====="
          php artisan tinker --execute='$events = App\Domains\Shared\Models\OperationalEvent::where("business_id", 5)->whereBetween("occurred_at", [now()->startOfMonth(), now()->endOfMonth()])->whereIn("event_type", ["order_confirmed", "tracking_number_added", "order_delivered", "order_returned", "order_resent", "fake_order_detected"])->get(); $key = fn ($e) => (string) (data_get($e->payload, "order_id") ?: $e->external_id ?: $e->id); $orders = $events->groupBy($key); $latest = $orders->map(fn ($g) => $g->sortBy(fn ($e) => sprintf("%012d-%012d", $e->occurred_at?->timestamp ?? 0, $e->id))->last()); $currentDelivered = $latest->where("event_type", "order_delivered"); $deliveredRows = $events->where("event_type", "order_delivered"); $returnedKeys = $events->where("event_type", "order_returned")->map($key)->unique(); dump(["lifecycle_order_count" => $orders->count(), "delivered_rows" => $deliveredRows->count(), "distinct_delivered_order_ids" => $deliveredRows->map($key)->unique()->count(), "delivered_row_sum" => (float) $deliveredRows->sum("revenue_amount"), "currently_delivered_orders" => $currentDelivered->count(), "currently_delivered_revenue" => (float) $currentDelivered->sum("revenue_amount"), "delivered_then_returned_order_count" => $deliveredRows->map($key)->unique()->intersect($returnedKeys)->count(), "same_order_multiple_delivered_rows" => $deliveredRows->groupBy($key)->filter(fn ($g) => $g->count() > 1)->map(fn ($g) => ["rows" => $g->count(), "sum" => (float) $g->sum("revenue_amount"), "amounts" => $g->pluck("revenue_amount")->all()])->take(30)->toArray(), "current_status_counts" => $latest->countBy("event_type")->toArray()]);'
          REMOTE
