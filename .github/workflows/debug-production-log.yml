name: Debug production log

on:
  push:
    branches:
      - helosfinance

jobs:
  inspect-production-log:
    name: Inspect production Laravel log
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/helios_lightsail
          printf '%s\n' "${{ secrets.HELIOS_LIGHTSAIL_SSH_KEY }}" > ~/.ssh/helios_lightsail
          ssh-keyscan -H 65.1.151.96 >> ~/.ssh/known_hosts

      - name: Tail Laravel logs
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 "
            sudo bash -lc '
              for file in \$(find /var/www -path \"*/storage/logs/laravel.log\" 2>/dev/null | sort -u); do
                echo \"===== \$file =====\"
                tail -n 160 \"\$file\" || true
              done
            '
          "

      - name: Inspect Nifras authorization path
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 'sudo bash -s' <<'REMOTE'
          echo "===== nginx site root ====="
          grep -R -E "server_name|root " /etc/nginx/sites-enabled 2>/dev/null || true

          echo "===== recent HTTP 403 responses ====="
          for file in /var/log/nginx/*access*.log; do
            [ -f "$file" ] || continue
            awk '$9 == 403 { print }' "$file" | tail -n 30
          done

          echo "===== Nifras application authorization ====="
          cd /var/www/helosfinance
          php artisan tinker --execute='$u = App\Models\User::whereRaw("LOWER(email) = ?", ["nifras@helos.com"])->first(); dump($u?->only(["id", "email", "business_id", "client_group_id", "is_platform_admin", "is_employee", "employee_access_profile", "responsibilities_configured", "is_staff_supervisor", "supervisor_user_id"])); if ($u) { Illuminate\Support\Facades\Auth::login($u); dump(["panel" => $u->canAccessPanel(Filament\Facades\Filament::getPanel("admin")), "staff" => $u->isStaff(), "todays_work" => App\Filament\Pages\TodaysWork::canAccess(), "url" => App\Filament\Pages\TodaysWork::getUrl()]); }'

          echo "===== Hosted role and recent task state ====="
          php artisan tinker --execute='$s = App\Models\User::whereRaw("LOWER(email) = ?", ["sanduashani@gmail.com"])->first(); dump(["sanduashani" => $s?->only(["id", "name", "business_id", "employee_access_profile", "staff_responsibilities", "is_staff_supervisor", "supervisor_user_id"])]); dump(App\Domains\Shared\Models\Mission::with(["assignedUser:id,name,email"])->where("business_id", 5)->where(function ($q) { $q->where("title", "like", "%production%")->orWhere("summary", "like", "%production%")->orWhere("responsibility_code", "production"); })->latest("updated_at")->limit(20)->get(["id", "title", "summary", "responsibility_code", "source_type", "source_id", "assigned_user_id", "assigned_by", "status", "due_at", "metadata"])->toArray());'

          echo "===== Current-month financial source reconciliation ====="
          php artisan tinker --execute='$b = App\Domains\Shared\Models\Business::find(5); $start = now()->startOfMonth(); $end = now()->endOfMonth(); $events = App\Domains\Shared\Models\OperationalEvent::where("business_id", 5)->whereBetween("occurred_at", [$start, $end]); dump(["snapshot" => app(App\Domains\FinancialClarity\Services\BusinessHealthSnapshotService::class)->currentMonthSummary($b), "pipeline" => app(App\Domains\FinancialClarity\Services\RevenuePipelineService::class)->forCurrentMonth($b), "event_totals" => (clone $events)->selectRaw("event_type, COUNT(*) row_count, COUNT(DISTINCT external_id) distinct_orders, SUM(revenue_amount) revenue, SUM(direct_cost_amount) direct_cost, SUM(leakage_amount) leakage, SUM(recovery_amount) recovery")->groupBy("event_type")->orderBy("event_type")->get()->toArray(), "duplicate_delivered_ids" => (clone $events)->where("event_type", "order_delivered")->selectRaw("external_id, COUNT(*) copies, SUM(revenue_amount) revenue")->groupBy("external_id")->havingRaw("COUNT(*) > 1")->orderByDesc("copies")->limit(30)->get()->toArray(), "largest_delivered_rows" => (clone $events)->where("event_type", "order_delivered")->orderByDesc("revenue_amount")->limit(20)->get(["id", "external_id", "revenue_amount", "direct_cost_amount", "channel", "occurred_at", "payload"])->toArray()]);'

          echo "===== Stable Stock App order reconciliation ====="
          php artisan tinker --execute='$events = App\Domains\Shared\Models\OperationalEvent::where("business_id", 5)->whereBetween("occurred_at", [now()->startOfMonth(), now()->endOfMonth()])->whereIn("event_type", ["order_confirmed", "tracking_number_added", "order_delivered", "order_returned", "order_resent", "fake_order_detected"])->get(); $key = fn ($e) => (string) (data_get($e->payload, "order_id") ?: $e->external_id ?: $e->id); $orders = $events->groupBy($key); $latest = $orders->map(fn ($g) => $g->sortBy(fn ($e) => sprintf("%012d-%012d", $e->occurred_at?->timestamp ?? 0, $e->id))->last()); $currentDelivered = $latest->where("event_type", "order_delivered"); $deliveredRows = $events->where("event_type", "order_delivered"); $returnedKeys = $events->where("event_type", "order_returned")->map($key)->unique(); dump(["lifecycle_order_count" => $orders->count(), "delivered_rows" => $deliveredRows->count(), "distinct_delivered_order_ids" => $deliveredRows->map($key)->unique()->count(), "delivered_row_sum" => (float) $deliveredRows->sum("revenue_amount"), "currently_delivered_orders" => $currentDelivered->count(), "currently_delivered_revenue" => (float) $currentDelivered->sum("revenue_amount"), "delivered_then_returned_order_count" => $deliveredRows->map($key)->unique()->intersect($returnedKeys)->count(), "same_order_multiple_delivered_rows" => $deliveredRows->groupBy($key)->filter(fn ($g) => $g->count() > 1)->map(fn ($g) => ["rows" => $g->count(), "sum" => (float) $g->sum("revenue_amount"), "amounts" => $g->pluck("revenue_amount")->all()])->take(30)->toArray(), "current_status_counts" => $latest->countBy("event_type")->toArray()]);'
          REMOTE
