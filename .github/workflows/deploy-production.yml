name: Production checks and deploy

on:
  pull_request:
    branches:
      - codex/aws-deploy-readiness
      - helosfinance
  push:
    branches:
      - codex/aws-deploy-readiness
      - helosfinance

concurrency:
  group: helios-production
  cancel-in-progress: false

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy to Lightsail
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/helios_lightsail
          printf '%s\n' "${{ secrets.HELIOS_LIGHTSAIL_SSH_KEY }}" > ~/.ssh/helios_lightsail
          ssh-keyscan -H 65.1.151.96 >> ~/.ssh/known_hosts

      - name: Run deployment
        run: ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 'sudo deploy-helosfinance ${{ github.ref_name }}'

      - name: Fast-forward known production app path
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 "
            sudo bash -lc '
              if [ -f /var/www/helosfinance/artisan ]; then
                cd /var/www/helosfinance
                git fetch origin ${{ github.ref_name }}
                git merge --ff-only origin/${{ github.ref_name }}
                composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
                php artisan migrate --force
              else
                echo \"/var/www/helosfinance/artisan not found\"
              fi
            '
          "

      - name: Clear runtime caches
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 "
            sudo bash -lc '
              for app in /var/www/*; do
                if [ -f \"\$app/artisan\" ]; then
                  echo \"===== clearing caches for \$app =====\"
                  cd \"\$app\"
                  php artisan optimize:clear || true
                  php artisan view:clear || true
                  php artisan config:clear || true
                  php artisan route:clear || true
                fi
              done

              systemctl reload php8.4-fpm 2>/dev/null || true
              systemctl reload php8.3-fpm 2>/dev/null || true
              systemctl reload php8.2-fpm 2>/dev/null || true
              systemctl reload php8.1-fpm 2>/dev/null || true
              systemctl reload nginx 2>/dev/null || true
              systemctl reload apache2 2>/dev/null || true
            '
          "

      - name: Verify deployed code fingerprint
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 "
            sudo bash -lc '
              for app in /var/www/*; do
                if [ -f \"\$app/artisan\" ]; then
                  echo \"===== app: \$app =====\"
                  cd \"\$app\"
                  git rev-parse HEAD 2>/dev/null || true
                  git status --short 2>/dev/null || true
                  if grep -q \"recognized_order_revenue\" app/Domains/FinancialClarity/Services/BusinessHealthSnapshotService.php 2>/dev/null; then
                    echo \"owner-revenue-fix: present\"
                  else
                    echo \"owner-revenue-fix: missing\"
                  fi
                fi
              done
            '
          "

      - name: Publish post-deploy HELOS health
        run: |
          ssh -i ~/.ssh/helios_lightsail ubuntu@65.1.151.96 'sudo bash -s' <<'REMOTE'
          cd /var/www/helosfinance
          mkdir -p public/diagnostics
          {
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "today_work_route=$(php artisan route:list --path=admin/todays-work 2>/dev/null | tr '\n' ' ')"
            echo "pending_cache_warm_start"
            timeout 30 php artisan tinker --execute='$business = App\Domains\Shared\Models\Business::query()->where("name", "like", "%Horns England%")->orderByDesc("id")->first(); if ($business) { $start = now()->subMonths(3)->startOfDay(); $result = app(App\Domains\Shared\Services\StockAppPendingParityService::class)->compare($business, $start, now()->endOfDay(), 0, true); echo json_encode(["available" => $result["available"] ?? false, "live_count" => $result["live_count"] ?? null, "warning" => $result["warning"] ?? false]).PHP_EOL; }' || echo "pending_cache_warm_failed=$?"
            echo "pending_cache_warm_end"
            echo "arafath_dashboard_probe_start"
            timeout 25 php artisan tinker --execute='$user = App\Models\User::query()->whereRaw("LOWER(email) = ?", ["arafath@helos.com"])->first(); $business = $user?->business ?: App\Domains\Shared\Models\Business::query()->where("name", "like", "%Horns England%")->orderByDesc("id")->first(); Illuminate\Support\Facades\Auth::login($user); $page = new App\Filament\Pages\TodaysWork; $page->business = $business; $page->parcelStartDate = now()->startOfMonth()->toDateString(); $page->parcelEndDate = now()->toDateString(); $method = new ReflectionMethod(App\Filament\Pages\TodaysWork::class, "employeeParcelMovement"); $method->setAccessible(true); $start = microtime(true); $movement = $method->invoke($page); echo json_encode(["ok" => true, "seconds" => round(microtime(true) - $start, 3), "business" => $business?->name, "boxes" => ["dispatched_count" => $movement["dispatched_count"] ?? null, "pending_confirmation_count" => $movement["pending_confirmation_count"] ?? null, "confirmed_waiting_dispatch_count" => $movement["confirmed_waiting_dispatch_count"] ?? null, "dispatched_waiting_delivery_count" => $movement["dispatched_waiting_delivery_count"] ?? null, "delivered_so_far_count" => $movement["delivered_so_far_count"] ?? null]]).PHP_EOL;' || echo "arafath_dashboard_probe_failed=$?"
            echo "arafath_dashboard_probe_end"
          } > public/diagnostics/deploy-health.txt
          REMOTE
