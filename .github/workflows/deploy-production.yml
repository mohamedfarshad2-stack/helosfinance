name: Production checks and deploy

on:
  pull_request:
    branches:
      - helosfinance
  push:
    branches:
      - helosfinance

concurrency:
  group: helos-production
  cancel-in-progress: false

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php -r '$key = "base64:" . base64_encode(random_bytes(32)); file_put_contents(".env", preg_replace("/^APP_KEY=.*/m", "APP_KEY={$key}", file_get_contents(".env")));'
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views bootstrap/cache database
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          php artisan config:clear

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy to Lightsail
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/helos_lightsail
          printf '%s\n' "${{ secrets.HELIOS_LIGHTSAIL_SSH_KEY }}" > ~/.ssh/helos_lightsail
          ssh-keyscan -H 65.1.151.96 >> ~/.ssh/known_hosts

      - name: Run deployment
        run: |
          ssh -i ~/.ssh/helos_lightsail ubuntu@65.1.151.96 <<'REMOTE'
          set -euo pipefail

          sudo deploy-helosfinance

          APP_DIR=""
          for candidate in /var/www/helosfinance /var/www/finance.codreturnslanka.lk /var/www/html/helosfinance /var/www/laravel/app; do
            if [ -f "$candidate/artisan" ] && [ -d "$candidate/.git" ] && grep -q "helosfinance" "$candidate/.git/config"; then
              APP_DIR="$candidate"
              break
            fi
          done

          if [ -z "$APP_DIR" ]; then
            echo "Unable to find deployed HELOS checkout."
            exit 1
          fi

          cd "$APP_DIR"
          git fetch origin helosfinance
          git checkout helosfinance
          git reset --hard origin/helosfinance

          composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan filament:clear-cached-components || true
          php artisan icons:clear || true
          php artisan config:cache
          php artisan route:cache
          php artisan view:clear

          sudo systemctl reload php8.4-fpm || sudo systemctl reload php8.3-fpm || sudo systemctl reload php8.2-fpm || sudo systemctl reload php8.1-fpm || true
          sudo systemctl reload nginx || true
          REMOTE
